<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>貼文</title>

  <style>
    body {
      font-family: -apple-system;
      background: #0f172a;
      color: white;
      padding: 20px;
    }

    .box {
      max-width: 700px;
      margin: auto;
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
    }

    textarea {
      width: 100%;
      height: 80px;
      margin-top: 10px;
      background: #334155;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px;
    }

    button {
      margin-top: 10px;
      background: #38bdf8;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: bold;
    }

    .comment {
      background: #0f172a;
      padding: 10px;
      margin-top: 8px;
      border-radius: 8px;
    }

    a {
      color: #38bdf8;
    }
  </style>
</head>

<body>

<div class="box">

  <a href="/">← 回首頁</a>

  <h2>{{post['title']}}</h2>
  <p>{{post['content']}}</p>

  <hr>

  <h3>留言</h3>

  {% for c in comments %}
    <div class="comment">
      💬 {{c['text']}}
    </div>
  {% endfor %}

  <form method="POST" action="/comment/{{post['id']}}">
    <textarea name="text" placeholder="寫留言..."></textarea>
    <br>
    <button>留言</button>
  </form>

</div>

</body>
</html>
