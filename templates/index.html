<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>科技論壇</title>

<style>
body {
  margin: 0;
  font-family: -apple-system;
  background: #0b1220;
  color: #e5e7eb;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
}

.card {
  background: #111827;
  padding: 16px;
  border-radius: 14px;
  margin-bottom: 12px;
}

.title {
  font-size: 18px;
  color: #60a5fa;
  font-weight: bold;
}

.meta {
  font-size: 12px;
  color: #9ca3af;
}

.content {
  margin-top: 8px;
}

button {
  background: #3b82f6;
  border: none;
  padding: 6px 10px;
  border-radius: 8px;
  color: white;
  cursor: pointer;
}

#loader {
  text-align: center;
  padding: 20px;
  color: #9ca3af;
}
</style>
</head>

<body>

<div class="container">
  <h1>🚀 科技論壇</h1>

  <div id="posts"></div>
  <div id="loader">載入中...</div>
</div>

<script>
let page = 0;
let loading = false;

async function loadPosts() {
  if (loading) return;
  loading = true;

  const res = await fetch(`/api/posts?page=${page}`);
  const data = await res.json();

  const container = document.getElementById("posts");

  data.forEach(p => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="title">${p.title}</div>
      <div class="meta">👍 ${p.score} | ID ${p.id}</div>
      <div class="content">${p.content}</div>
      <a href="/upvote/${p.id}"><button>+1</button></a>
    `;

    container.appendChild(div);
  });

  if (data.length === 0) {
    document.getElementById("loader").innerText = "沒有更多文章";
  }

  page++;
  loading = false;
}

window.addEventListener("scroll", () => {
  if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 200) {
    loadPosts();
  }
});

loadPosts();
</script>

</body>
</html>
