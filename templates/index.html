<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>科技業論壇</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI";
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 28px;
    }

    .card {
      background: #1e293b;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      margin-bottom: 8px;
      border-radius: 8px;
      border: none;
      background: #334155;
      color: white;
    }

    button {
      background: #38bdf8;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #0ea5e9;
    }

    a {
      color: #38bdf8;
      text-decoration: none;
    }

    .post-title {
      font-size: 18px;
      font-weight: bold;
    }

    .meta {
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>🚀 科技業論壇</h1>

    <div class="card">
      <form method="POST" action="/post">
        <input name="title" placeholder="標題">
        <textarea name="content" placeholder="發文內容"></textarea>
        <button type="submit">發文</button>
      </form>
    </div>

    {% for p in posts %}
    <div class="card">
      <div class="post-title">
        <a href="/post/{{p['id']}}">{{p['title']}}</a>
      </div>

      <div class="meta">
        👍 {{p['score']}} | ID {{p['id']}}
      </div>

      <p>{{p['content']}}</p>

      <a href="/upvote/{{p['id']}}">+1 👍</a>
    </div>
    {% endfor %}

  </div>
</body>
</html>
